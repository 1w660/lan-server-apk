name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # 支持在 Actions 页面手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest   # 官方 buildozer 环境镜像
      options: --user root           # 容器内以 root 运行，避免权限问题
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 预接受 Android SDK 许可证，修复 "build-tools 未安装 / Aidl not found"
      - name: Accept Android SDK licenses
        run: |
          SDKROOT=/home/user/.buildozer/android/platform/android-sdk
          mkdir -p "$SDKROOT/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDKROOT/licenses/android-sdk-license"
          yes | "$SDKROOT/tools/bin/sdkmanager" --sdk_root="$SDKROOT" --licenses >/dev/null 2>&1 || true

      - name: Build APK (debug)
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-server-apk
          path: bin/*.apk
          if-no-files-found: error
