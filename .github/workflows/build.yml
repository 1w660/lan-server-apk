name: Build Android APK

on:
  push:
    branches: [ main ]      # 推送到 main 分支时自动构建
  workflow_dispatch:         # 同时允许在网页上手动触发

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 免费提供的 Linux 虚拟机，自带 Docker
    steps:
      # 1. 把仓库代码拉到虚拟机的工作目录
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 用 kivy/buildozer 官方镜像执行 buildozer -v android debug
      - name: Build Debug APK
        run: |
          docker run --rm \
            --volume "$PWD:/home/user/hostcwd" \
            --env USER_ID=$(id -u) \
            --env GROUP_ID=$(id -g) \
            kivy/buildozer:latest \
            -v android debug

      # 3. 把 bin/ 目录下生成的 APK 作为产物上传
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lan-server-debug-apk
          path: bin/*.apk
          if-no-files-found: error
